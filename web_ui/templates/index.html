<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>招聘数据采集与可视化系统</title>
  <!-- ECharts CDN -->
  <script src="https://cdn.jsdelivr.net/npm/echarts@5.5.0/dist/echarts.min.js"></script>
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>

  <!-- ================================================================ -->
  <!--  Header: 标题 + 爬虫控制面板                                       -->
  <!-- ================================================================ -->
  <header class="header">
    <div class="header-left">
      <h1>🕷️ 招聘数据采集与可视化系统</h1>
      <span class="subtitle">牛客网 · 校招/社招职位数据</span>
    </div>
    <div class="header-right">
      <button class="btn btn-outline" onclick="exportCSV()" title="下载 CSV">📥 导出数据</button>
      <button class="btn btn-outline" onclick="refreshAll()" title="刷新所有数据">🔄 刷新</button>
    </div>
  </header>

  <!-- ================================================================ -->
  <!--  Spider Control Bar                                               -->
  <!-- ================================================================ -->
  <div class="control-bar">
    <div class="control-group">
      <label>关键词</label>
      <input type="text" id="spider-keyword" value="Python" placeholder="如：Java、前端、测试">
    </div>
    <div class="control-group">
      <label>招聘类型</label>
      <select id="spider-recruit-type">
        <option value="1">校招</option>
        <option value="2">社招</option>
      </select>
    </div>
    <div class="control-group">
      <label>最大页数</label>
      <input type="number" id="spider-max-pages" value="10" min="1" max="50" style="width:70px">
    </div>
    <button class="btn btn-primary" id="btn-start" onclick="startSpider()">▶ 启动爬虫</button>
    <button class="btn btn-danger" id="btn-stop" onclick="stopSpider()" disabled>⏹ 停止</button>
    <span id="spider-status-text" class="spider-status idle">⚪ 就绪</span>
  </div>

  <!-- ================================================================ -->
  <!--  KPI Cards                                                         -->
  <!-- ================================================================ -->
  <div class="kpi-row" id="kpi-row">
    <div class="kpi-card">
      <div class="kpi-icon">📋</div>
      <div class="kpi-value" id="kpi-jobs">--</div>
      <div class="kpi-label">职位总数</div>
    </div>
    <div class="kpi-card">
      <div class="kpi-icon">🏢</div>
      <div class="kpi-value" id="kpi-companies">--</div>
      <div class="kpi-label">公司数量</div>
    </div>
    <div class="kpi-card">
      <div class="kpi-icon">🌆</div>
      <div class="kpi-value" id="kpi-cities">--</div>
      <div class="kpi-label">覆盖城市</div>
    </div>
    <div class="kpi-card">
      <div class="kpi-icon">💰</div>
      <div class="kpi-value" id="kpi-salary">--</div>
      <div class="kpi-label">平均薪资范围</div>
    </div>
    <div class="kpi-card">
      <div class="kpi-icon">🕐</div>
      <div class="kpi-value" id="kpi-time">--</div>
      <div class="kpi-label">数据更新时间</div>
    </div>
  </div>

  <!-- ================================================================ -->
  <!--  Charts Grid                                                       -->
  <!-- ================================================================ -->
  <div class="charts-grid">
    <!-- Row 1: Salary Distribution + City Distribution -->
    <div class="chart-panel">
      <div class="chart-title">📊 薪资分布</div>
      <div class="chart-container" id="chart-salary"></div>
    </div>
    <div class="chart-panel">
      <div class="chart-title">🏙️ 城市职位分布 (Top 20)</div>
      <div class="chart-container" id="chart-city"></div>
    </div>

    <!-- Row 2: Industry Pie + Education Ring + Experience Bar -->
    <div class="chart-panel chart-panel-sm">
      <div class="chart-title">🏭 行业分布</div>
      <div class="chart-container" id="chart-industry"></div>
    </div>
    <div class="chart-panel chart-panel-sm">
      <div class="chart-title">🎓 学历要求</div>
      <div class="chart-container" id="chart-education"></div>
    </div>
    <div class="chart-panel chart-panel-sm">
      <div class="chart-title">💼 经验要求</div>
      <div class="chart-container" id="chart-experience"></div>
    </div>

    <!-- Row 3: Publish Time Trend -->
    <div class="chart-panel chart-panel-full">
      <div class="chart-title">📅 发布时间趋势（按月）</div>
      <div class="chart-container" id="chart-time"></div>
    </div>
  </div>

  <!-- ================================================================ -->
  <!--  Job Table Section                                                 -->
  <!-- ================================================================ -->
  <div class="table-section">
    <div class="table-header">
      <h2>📋 职位列表</h2>
      <div class="table-controls">
        <input type="text" id="table-search" placeholder="🔍 搜索职位/公司..." oninput="loadJobs()">
        <select id="table-city-filter" onchange="loadJobs()">
          <option value="">全部城市</option>
        </select>
        <select id="table-edu-filter" onchange="loadJobs()">
          <option value="">全部学历</option>
        </select>
        <select id="table-industry-filter" onchange="loadJobs()">
          <option value="">全部行业</option>
        </select>
        <select id="table-exp-filter" onchange="loadJobs()">
          <option value="">全部经验</option>
        </select>
        <span class="table-count" id="table-count">共 0 条</span>
      </div>
    </div>

    <div class="table-wrapper">
      <table id="jobs-table">
        <thead>
          <tr>
            <th data-sort="job_name" onclick="sortTable('job_name')">职位名称 ▸</th>
            <th data-sort="salary" onclick="sortTable('salary')">薪资 ▸</th>
            <th data-sort="company_name" onclick="sortTable('company_name')">公司 ▸</th>
            <th data-sort="city" onclick="sortTable('city')">城市 ▸</th>
            <th data-sort="education" onclick="sortTable('education')">学历 ▸</th>
            <th data-sort="experience" onclick="sortTable('experience')">经验 ▸</th>
            <th data-sort="industry" onclick="sortTable('industry')">行业 ▸</th>
            <th data-sort="publish_time" onclick="sortTable('publish_time')">发布日期 ▸</th>
            <th>详情</th>
          </tr>
        </thead>
        <tbody id="jobs-tbody">
          <tr><td colspan="9" class="loading-row">加载中...</td></tr>
        </tbody>
      </table>
    </div>

    <div class="pagination" id="pagination">
      <button id="btn-prev" onclick="prevPage()" disabled>◀ 上一页</button>
      <span id="page-info">第 1/1 页</span>
      <button id="btn-next" onclick="nextPage()" disabled>下一页 ▶</button>
    </div>
  </div>

  <!-- ================================================================ -->
  <!--  Log Panel (collapsible)                                           -->
  <!-- ================================================================ -->
  <div class="log-section" id="log-section">
    <div class="log-header" onclick="toggleLog()">
      <h2>📜 爬虫运行日志 <span id="log-badge" class="badge hidden">● 运行中</span></h2>
      <button class="btn btn-sm" id="btn-clear-log" onclick="event.stopPropagation(); clearLog()">清空</button>
    </div>
    <div class="log-content" id="log-content">
      <div class="log-lines" id="log-lines">
        <div class="log-line dim">等待爬虫启动...</div>
      </div>
    </div>
  </div>

  <!-- ================================================================ -->
  <!--  Detail Modal                                                      -->
  <!-- ================================================================ -->
  <div class="modal-overlay" id="modal-overlay" onclick="closeModal()">
    <div class="modal" onclick="event.stopPropagation()">
      <div class="modal-header">
        <h3 id="modal-title">职位详情</h3>
        <button class="btn-close" onclick="closeModal()">✕</button>
      </div>
      <div class="modal-body" id="modal-body"></div>
    </div>
  </div>

  <script src="/static/app.js"></script>
</body>
</html>
